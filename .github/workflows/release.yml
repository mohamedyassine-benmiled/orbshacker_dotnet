name: Build & Release
on:
  pull_request:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Test
        run: dotnet test Orbshacker.sln --configuration Release
      - name: Publish self-contained executable
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/Orbshacker/Orbshacker.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version --output publish
      - uses: softprops/action-gh-release@v2.6.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Orbshacker ${{ github.ref_name }}
          generate_release_notes: true
          files: publish/orbshacker.exe
